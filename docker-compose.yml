services:
  postgres:
    image: postgres:16-alpine
    container_name: my-sports-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportsstore}
      POSTGRES_USER: ${POSTGRES_USER:-sportsstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportsstore}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportsstore} -d ${POSTGRES_DB:-sportsstore}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
