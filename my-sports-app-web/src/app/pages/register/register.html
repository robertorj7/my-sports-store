<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="auth-header">
      <span class="auth-logo">⚽</span>
      <h1>Criar conta</h1>
      <p>Cadastre-se para comprar na My Sports Store</p>
    </div>

    @if (error()) {
      <div class="alert alert-error" role="alert">{{ error() }}</div>
    }

    <label class="field">
      <span>Nome</span>
      <input type="text" formControlName="name" autocomplete="name" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <small class="field-error">Informe o nome.</small>
      }
    </label>

    <label class="field">
      <span>E-mail</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">
          {{ form.controls.email.hasError('required') ? 'Informe o e-mail.' : 'E-mail inválido.' }}
        </small>
      }
    </label>

    <label class="field">
      <span>Senha</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">A senha deve ter entre 6 e 100 caracteres.</small>
      }
    </label>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
      {{ loading() ? 'Cadastrando...' : 'Cadastrar' }}
    </button>

    <p class="auth-footer">Já tem conta? <a routerLink="/login">Entrar</a></p>
  </form>
</div>
