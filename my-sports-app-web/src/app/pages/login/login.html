<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="auth-header">
      <span class="auth-logo">⚽</span>
      <h1>My Sports Store</h1>
      <p>Entre com sua conta para continuar</p>
    </div>

    @if (error()) {
      <div class="alert alert-error" role="alert">{{ error() }}</div>
    }

    <label class="field">
      <span>E-mail</span>
      <input type="email" formControlName="email" autocomplete="email" placeholder="voce@exemplo.com" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">
          {{ form.controls.email.hasError('required') ? 'Informe o e-mail.' : 'E-mail inválido.' }}
        </small>
      }
    </label>

    <label class="field">
      <span>Senha</span>
      <div class="password-input">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
        <button type="button" class="toggle" (click)="showPassword.set(!showPassword())">
          {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </div>
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">Informe a senha.</small>
      }
    </label>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
      {{ loading() ? 'Entrando...' : 'Entrar' }}
    </button>

    <p class="auth-footer">Não tem conta? <a routerLink="/register">Cadastre-se</a></p>
  </form>
</div>
