spring.application.name=my-sports-store-api
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sportsstore}
spring.datasource.username=${DB_USERNAME:sportsstore}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION}

app.cors.allowed-origins=${CORS_URI}

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.auto-offset-reset=earliest

app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:500}
app.payment.approval-limit=${PAYMENT_APPROVAL_LIMIT:5000}
app.payment.processing-delay-ms=${PAYMENT_PROCESSING_DELAY_MS:2000}
